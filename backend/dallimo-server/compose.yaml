# 운영 배포용 (gamjabox). 로컬 개발에는 쓰지 않는다 (결정 로그 59항)
# 비밀 값(DB_PASSWORD · DB_ROOT_PASSWORD · JWT_SECRET · ADMIN_API_KEY · METRICS_TOKEN · GRAFANA_ADMIN_PASSWORD)은 여기 적지 않는다. 배포 도구의 환경변수 파일(.env)로 넣는다. 키 설명은 .env.example
# .env에 없는 값은 빈 문자열로 들어간다. 비밀 값이 비면 MySQL · 서버가 시작하지 않는다
services:
  dallimo-server:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # ── DB · Redis: 아래 mysql · redis 서비스 ──────────────────────
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dallimo
      DB_USERNAME: dallimo
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # ── 인증 ──────────────────────────────────────────────────
      # openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET}
      # 웹으로 띄운 앱(npx expo start --web)에서 이 서버를 부를 수 있게. 관리 웹 주소는 SecurityConfig에 있다
      CORS_ALLOWED_ORIGINS: http://localhost:8081

      # ── 공개 주소(gamjabox 도메인) · App Link ─────────────────────────
      SHARE_PUBLIC_BASE_URL: https://dallimo.gamjabox.cloud
      # {Apple 팀 ID}.{iOS 번들 ID} · Android 패키지 (결정 로그 63항, 앱 app.config.ts와 같게)
      APP_LINK_IOS_APP_IDS: Q336TS439T.com.dongseopseo.dallimo
      APP_LINK_ANDROID_PACKAGE: com.dongseopseo.dallimo
      # Play Console 앱 서명 키의 SHA-256. Play Console에 앱을 올린 뒤 .env에 넣는다
      APP_LINK_ANDROID_SHA256: ${APP_LINK_ANDROID_SHA256}

      # ── 관리 API 키 (X-Admin-Key, curl용). 비어 있으면 키로는 부를 수 없다. 관리 웹은 관리자 계정으로 ──
      # openssl rand -hex 24. application-dev.yaml의 개발 키는 공개돼 있어서 쓰지 않는다
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      COURSE_AUTO_HIDE_REPORTS: 3

      # ── 외부 추천 코스 ──────────────────────────────────────────
      DATA_GO_KR_SERVICE_KEY: e1b62338c3bf254ea990f9b43b06d8bd1baeb10fd90232e55143e49e821aeaca
      EXTERNAL_COURSE_CRON: "-"
      EXTERNAL_COURSE_OSM_BOXES: ${EXTERNAL_COURSE_OSM_BOXES}
      EXTERNAL_ELEVATION_ENABLED: "false"

      # ── Push ─────────────────────────────────────────────────
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}

      # ── 성능 지표 (아래 prometheus가 Bearer로 가져간다. 비어 있으면 지표 주소를 닫는다) ──
      # openssl rand -hex 24
      METRICS_TOKEN: ${METRICS_TOKEN}

      # ── 강제 업데이트: 이 버전보다 낮은 앱은 App Store로 보낸다 (비어 있으면 막지 않는다) ──
      APP_MIN_VERSION_IOS: ${APP_MIN_VERSION_IOS}
      APP_STORE_URL_IOS: https://apps.apple.com/kr/app/%EB%8B%AC%EB%A6%AC%EB%AA%A8/id6818753247
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dallimo
      MYSQL_USER: dallimo
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # ── 성능 지표 (18장 관측성, backend/README.md "성능 지표") ─────────────
  # 15초마다 dallimo-server:8080/actuator/prometheus를 가져와 30일 보관한다. 바깥으로 포트를 열지 않는다
  prometheus:
    build: ./monitoring/prometheus
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
    # 토큰을 파일로 쓰고 시작한다 (prometheus.yml의 credentials_file)
    entrypoint: ["/bin/sh", "-c"]
    command: ['printf %s "$$METRICS_TOKEN" > /prometheus/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d']
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      - dallimo-server

  # 대시보드 "달리모 > 달리모 서버". http://{서버}:3000, 계정 admin / GRAFANA_ADMIN_PASSWORD
  grafana:
    build: ./monitoring/grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DEFAULT_TIMEZONE: Asia/Seoul
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
