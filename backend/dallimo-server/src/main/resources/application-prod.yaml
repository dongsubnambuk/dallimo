# 운영 (MariaDB). 접속 정보는 환경변수로만 받는다
spring:
  # DB_URL을 주면 그대로 쓰고, 없으면 DB_HOST · DB_PORT · DB_NAME으로 만든다. DB가 없으면 만든다(권한이 있을 때).
  # 드라이버: 운영 MariaDB는 mariadb(기본), MySQL이면 DB_DRIVER=mysql. 테이블은 서버가 시작할 때 Flyway가 만든다(SQL을 따로 실행하지 않는다)
  datasource:
    url: ${DB_URL:jdbc:${DB_DRIVER:mariadb}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dallimo}?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # 8장 실시간 상태 (ADR-005)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
# API 문서는 운영에서 열지 않는다 (저장소의 docs/api/openapi.yaml을 본다)
springdoc:
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

dallimo:
  # Expo Push. Enhanced push security를 켰으면 access token (저장소에 넣지 않는다)
  push:
    provider: expo
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
  # 공유 링크 주소 · App Link (SHR-004). 도메인 · 앱 id는 배포 때 환경변수로
  share:
    public-base-url: ${SHARE_PUBLIC_BASE_URL:}
    app-links:
      ios-app-ids: ${APP_LINK_IOS_APP_IDS:}
      android-package: ${APP_LINK_ANDROID_PACKAGE:}
      android-sha256: ${APP_LINK_ANDROID_SHA256:}
