# 운영 (MariaDB). 접속 정보는 환경변수로만 받는다
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # 8장 실시간 상태 (ADR-005)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
# API 문서는 운영에서 열지 않는다 (저장소의 docs/api/openapi.yaml을 본다)
springdoc:
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

dallimo:
  # Expo Push. Enhanced push security를 켰으면 access token (저장소에 넣지 않는다)
  push:
    provider: expo
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
  # 공유 링크 주소 · App Link (SHR-004). 도메인 · 앱 id는 배포 때 환경변수로
  share:
    public-base-url: ${SHARE_PUBLIC_BASE_URL:}
    app-links:
      ios-app-ids: ${APP_LINK_IOS_APP_IDS:}
      android-package: ${APP_LINK_ANDROID_PACKAGE:}
      android-sha256: ${APP_LINK_ANDROID_SHA256:}
