# 운영 (MariaDB). 접속 정보는 환경변수로만 받는다
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # 8장 실시간 상태 (ADR-005)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
management:
  endpoint:
    health:
      show-details: never
