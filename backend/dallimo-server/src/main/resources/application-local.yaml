# 개발자 로컬: backend/dallimo-server/docker-compose.yml의 MySQL
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dallimo?connectionTimeZone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:dallimo}
    password: ${DB_PASSWORD:dallimo}
  flyway:
    # 로컬에만 개발용 코스 3개를 넣는다 (db/seed/local, scripts/gen-local-seed.mts)
    locations: classpath:db/migration,classpath:db/seed/local

dallimo:
  auth:
    # 로컬 개발 전용 키 (운영 · 개발 서버는 환경변수 JWT_SECRET)
    jwt-secret: ${JWT_SECRET:AERm8GKK5VfBavXhoYdDqF87u1fDPcnLAxE7OjjFLoE=}
    # 웹(개발 확인용) Expo 서버
    cors-allowed-origins:
      - http://localhost:8081
  # 공유 페이지에 "웹에서 열기(개발용)"를 보여준다. 공유 URL은 요청이 들어온 서버 주소를 쓴다 (아이폰은 노트북 IP)
  share:
    web-app-url: http://localhost:8081
