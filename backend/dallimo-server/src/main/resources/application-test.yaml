# 테스트: DB는 Testcontainers가 띄워 연결 정보를 넣는다 (TestcontainersConfiguration)
spring:
  jpa:
    show-sql: false

dallimo:
  auth:
    jwt-secret: HaSada1RP35IJ1qg77GriqEzZTIFUUajipn/c5Tszjw=
  # 테스트는 커밋 뒤 검증만 쓴다 (주기 재검사가 다른 테스트의 Run을 건드리지 않게)
  verification:
    sweep-interval: 1h
  # Push: 로컬 · 테스트는 보내지 않고 로그만 (Expo 계정 · 실기기 없이)
  push:
    provider: log
  mail:
    provider: log
  # 요청 제한: 테스트는 같은 IP로 가입 · 로그인을 많이 해서 끈다 (RateLimitApiTest가 켜서 확인)
  rate-limit:
    enabled: false
  # 올린 파일은 임시 폴더에
  storage:
    local-dir: ${java.io.tmpdir}/dallimo-test-uploads
