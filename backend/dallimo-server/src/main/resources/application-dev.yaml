# 개발 (기본 프로필). 내 컴퓨터에서 띄우는 개발 서버다 (사용자 결정: local과 dev를 나누지 않는다). 운영은 application-prod.yaml
# DB · Redis는 개발자가 직접 준비한다(로컬에서 Docker를 쓰지 않는다). 아래는 접속 기본값이고 환경변수로 바꾼다 (backend/README.md "로컬 실행")
spring:
  # DB_URL을 주면 그대로 쓰고, 없으면 DB_HOST · DB_PORT · DB_NAME으로 만든다. DB가 없으면 만든다(권한이 있을 때).
  # 드라이버: 개발은 MySQL(mysql, 기본), MariaDB로 확인하려면 DB_DRIVER=mariadb. 테이블은 서버가 시작할 때 Flyway가 만든다
  datasource:
    url: ${DB_URL:jdbc:${DB_DRIVER:mysql}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dallimo}?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:dallimo}
    password: ${DB_PASSWORD:dallimo}
  # 8장 실시간 상태 (ADR-005)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    # 개발 DB에만 개발용 코스 3개를 넣는다 (db/seed/dev, scripts/gen-dev-seed.mts)
    locations: classpath:db/migration,classpath:db/seed/dev

dallimo:
  auth:
    # 개발 전용 키 (운영은 환경변수 JWT_SECRET)
    jwt-secret: ${JWT_SECRET:AERm8GKK5VfBavXhoYdDqF87u1fDPcnLAxE7OjjFLoE=}
    # 웹(개발 확인용) Expo 서버
    cors-allowed-origins:
      - http://localhost:8081
  # 공유 페이지에 "웹에서 열기(개발용)"를 보여준다. 공유 URL은 요청이 들어온 서버 주소를 쓴다 (아이폰은 노트북 IP)
  share:
    web-app-url: http://localhost:8081
  # Push: 기본은 보내지 않고 로그만 (Expo 계정 · 실기기 없이). 실제로 보내 보려면 PUSH_PROVIDER=expo
  push:
    provider: ${PUSH_PROVIDER:log}
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
  # 메일: 기본은 보내지 않고 로그만 (인증 코드를 로그에서 본다). Resend로 보내 보려면 MAIL_PROVIDER=resend · RESEND_API_KEY
  mail:
    provider: ${MAIL_PROVIDER:log}
