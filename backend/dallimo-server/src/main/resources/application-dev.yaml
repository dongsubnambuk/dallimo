# 개발 기본 프로필
# - 로컬 개발 서버용
# - local / dev 프로필을 별도로 나누지 않음
# - 운영 환경은 application-prod.yaml 사용
# - DB / Redis는 로컬에 직접 설치해서 사용

spring:
  datasource:
    # MySQL 개발 DB
    # DB가 없으면 자동 생성
    url: jdbc:mysql://localhost:3306/dallimo?createDatabaseIfNotExist=true
    username: root
    password: 123456

  # 실시간 상태 관리 (ADR-005)
  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    # 개발 DB에만 개발용 코스 3개 추가
    locations:
      - classpath:db/migration
      - classpath:db/seed/dev

dallimo:
  auth:
    # 개발 전용 JWT 키
    jwt-secret: AERm8GKK5VfBavXhoYdDqF87u1fDPcnLAxE7OjjFLoE=

    # 웹 개발 확인용 Expo 서버
    cors-allowed-origins:
      - http://localhost:8081

  share:
    # 공유 페이지 개발용 웹 주소
    web-app-url: http://localhost:8081

  push:
    # 개발 환경에서는 실제 Push 전송 없이 로그만 출력
    provider: log
    expo-access-token: ""

  mail:
    # 개발 환경에서는 실제 메일 전송 없이 로그만 출력
    provider: log