# 개발 서버 (MySQL). 접속 정보는 환경변수로만 받는다
spring:
  # DB_URL을 주면 그대로 쓰고, 없으면 DB_HOST · DB_PORT · DB_NAME으로 만든다. DB가 없으면 만든다(권한이 있을 때).
  # 드라이버: 개발 서버 MySQL은 mysql(기본), MariaDB면 DB_DRIVER=mariadb. 테이블은 서버가 시작할 때 Flyway가 만든다(SQL을 따로 실행하지 않는다)
  datasource:
    url: ${DB_URL:jdbc:${DB_DRIVER:mysql}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dallimo}?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # 8장 실시간 상태 (ADR-005)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

dallimo:
  # Expo Push. Enhanced push security를 켰으면 access token (저장소에 넣지 않는다)
  push:
    provider: expo
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
