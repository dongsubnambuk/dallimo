# 공통 설정. 환경별 값은 application-{dev,test,prod}.yaml (명세 15.3장. 사용자 결정으로 local은 dev에 합쳤다)
# DB · OAuth · Push 같은 비밀 값은 저장소에 넣지 않고 환경변수로 받는다.
spring:
  application:
    name: dallimo-server
  profiles:
    default: dev
  jpa:
    open-in-view: false
    # 스키마는 Flyway만 바꾼다. JPA는 엔티티와 스키마가 맞는지만 확인한다
    hibernate:
      ddl-auto: validate
    properties:
      # 40.4장: DATETIME(3)은 UTC로 읽고 쓴다
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  datasource:
    hikari:
      # 40.4장: DB 세션 시간대도 UTC (DB 서버 시간대가 달라도 DATETIME을 같은 기준으로)
      connection-init-sql: SET time_zone = '+00:00'
  jackson:
    time-zone: UTC
  # 프로필 사진 (사진은 서버가 512px로 다시 만든다, ProfileImages)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  shutdown: graceful
  # 프록시(nginx · 로드밸런서) 뒤에서 실제 사용자 IP · https 주소를 쓴다. 안 하면 모든 요청이 프록시 IP로 보여
  # IP마다 세는 요청 제한(로그인 · 공유 링크)을 모든 사용자가 나눠 쓰게 된다.
  # 프록시가 보낸 X-Forwarded-For · Proto · Host만 믿는다. 믿는 프록시는 사설 · 루프백 주소(Tomcat 기본)다.
  # 프록시가 공인 IP면 SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES(정규식)로 그 주소를 넣는다
  forward-headers-strategy: native

# 57장 API Contract: /v3/api-docs(.yaml). API만 (공유 페이지 · actuator 제외), 키 순서를 고정해 문서가 매번 같게
springdoc:
  paths-to-match: /api/**
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# 21.1장 관측성: 로그 줄마다 요청 · 사용자(내부 id) · Run id (common/observability/Correlation). 위치 · 개인정보는 남기지 않는다
logging:
  pattern:
    correlation: "[req=%X{requestId:-} user=%X{userId:-} run=%X{runId:-}] "
  level:
    # 시작할 때 Hibernate가 DB 접속 주소를 그대로 찍는다. MariaDB 드라이버는 주소에 비밀번호를 넣어서 로그에 남는다
    org.hibernate.orm.connections.pooling: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 14.1장 인증. 유효 시간은 명세에 없어 정한 값 (backend/README 결정 사항)
dallimo:
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: dallimo
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    refresh-reuse-grace: 60s
  # 올린 파일(프로필 사진). 지금은 서버 디스크, 주소 앞부분이 비어 있으면 요청이 들어온 서버 주소 (ImageStorage)
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
  # 외부 공개 데이터로 추천 코스 만들기 (ExternalCourseProperties, FOUNDATION-DECISION-LOG 52항)
  # 메일 (MailProperties, 결정 로그 58항): 비밀번호 재설정 인증 코드 · 비밀번호 변경 알림. 보내는 주소는 Resend에서 인증한 도메인
  mail:
    provider: ${MAIL_PROVIDER:resend}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:달리모 <onboarding@resend.dev>}
  # 관리 API 키 (X-Admin-Key, AdminKeyGuard). 비어 있으면 관리 API를 모두 닫는다. EXTERNAL_COURSE_ADMIN_KEY는 예전 이름
  admin:
    api-key: ${ADMIN_API_KEY:${EXTERNAL_COURSE_ADMIN_KEY:}}
  # 코스 신고 처리 (CourseModerationProperties, FOUNDATION-DECISION-LOG 53항): 서로 다른 사람의 신고가 이만큼 쌓이면 자동으로 숨긴다
  moderation:
    auto-hide-reports: ${COURSE_AUTO_HIDE_REPORTS:3}
  external-courses:
    durunubi:
      # 공공데이터포털 일반 인증키(Decoding). 비어 있으면 두루누비를 부르지 않는다
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
    elevation:
      # Open-Meteo 무료 API는 비상업 이용 조건이라 기본은 끈다
      enabled: ${EXTERNAL_ELEVATION_ENABLED:false}
      url: ${EXTERNAL_ELEVATION_URL:https://api.open-meteo.com/v1/elevation}
    schedule:
      # 예: "0 0 4 * * MON" (매주 월요일 04:00 UTC). "-"면 돌지 않는다
      cron: ${EXTERNAL_COURSE_CRON:-}
      # 예: "35.80,128.55,35.90,128.70;37.50,126.90,37.60,127.05" (south,west,north,east를 ;로 잇는다)
      osm-boxes: ${EXTERNAL_COURSE_OSM_BOXES:}
