# 공통 설정. 환경별 값은 application-{local,dev,test,prod}.yaml (명세 15.3장)
# DB · OAuth · Push 같은 비밀 값은 저장소에 넣지 않고 환경변수로 받는다.
spring:
  application:
    name: dallimo-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    # 스키마는 Flyway만 바꾼다. JPA는 엔티티와 스키마가 맞는지만 확인한다
    hibernate:
      ddl-auto: validate
    properties:
      # 40.4장: DATETIME(3)은 UTC로 읽고 쓴다
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  # 프로필 사진 (사진은 서버가 512px로 다시 만든다, ProfileImages)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 14.1장 인증. 유효 시간은 명세에 없어 정한 값 (backend/README 결정 사항)
dallimo:
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: dallimo
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    refresh-reuse-grace: 60s
  # 올린 파일(프로필 사진). 지금은 서버 디스크, 주소 앞부분이 비어 있으면 요청이 들어온 서버 주소 (ImageStorage)
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
