# 공통 설정. 환경별 값은 application-{local,dev,test,prod}.yaml (명세 15.3장)
# DB · OAuth · Push 같은 비밀 값은 저장소에 넣지 않고 환경변수로 받는다.
spring:
  application:
    name: dallimo-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    # 스키마는 Flyway만 바꾼다. JPA는 엔티티와 스키마가 맞는지만 확인한다
    hibernate:
      ddl-auto: validate
    properties:
      # 40.4장: DATETIME(3)은 UTC로 읽고 쓴다
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
