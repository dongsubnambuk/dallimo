openapi: 3.1.0
info:
  description: "달리모 서버 API. 응답은 { success, data, error, timestamp } (7.1장), 오류 코드는\
    \ 27.1장. 명세 41~45장과 다른 곳은 frontend/docs/api/MOCK-CONTRACT-CHECK.md"
